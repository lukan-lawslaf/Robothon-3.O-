<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robothon 3.0 — Interactive 3D Bot & Exploded View</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: rgba(17, 24, 39, 0.88);
      --accent: #f59e0b;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; width: 100vw; }
    #canvas-container { width: 100%; height: 100%; }

    .hud {
      position: absolute; top: 20px; left: 20px; width: 340px;
      background: var(--panel); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
      padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .hud h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
    .hud p.sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 16px; }

    .control-group { margin-bottom: 16px; }
    .control-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; font-weight: 600; }
    input[type="range"] {
      width: 100%; accent-color: var(--accent); cursor: pointer;
    }

    .btn-row { display: flex; gap: 8px; margin-bottom: 14px; }
    button {
      flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06); color: var(--text); font-weight: 600; font-size: 0.82rem;
      cursor: pointer; transition: all 0.2s;
    }
    button:hover { background: rgba(245, 158, 11, 0.2); border-color: var(--accent); }
    button.primary { background: var(--accent); color: #000; border-color: var(--accent); }
    button.primary:hover { background: #fbbf24; }

    .parts-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .part-chip {
      padding: 7px 10px; border-radius: 6px; font-size: 0.78rem;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .part-chip:hover, .part-chip.active { border-color: var(--accent); background: rgba(245, 158, 11, 0.15); }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    #info-card {
      margin-top: 14px; padding: 12px; border-radius: 8px;
      background: rgba(0,0,0,0.35); border-left: 3px solid var(--accent);
      font-size: 0.8rem; line-height: 1.4;
    }
    #info-card strong { color: var(--accent); display: block; margin-bottom: 2px; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="hud">
    <h1>ROBOTHON 3.0 BOT</h1>
    <p class="sub">Interactive 4WD Exploded View & GLB Generator</p>

    <div class="control-group">
      <div class="control-header">
        <span>Explode View</span>
        <span id="explode-val">0%</span>
      </div>
      <input type="range" id="explode-slider" min="0" max="100" value="0" />
    </div>

    <div class="btn-row">
      <button id="toggle-explode-btn" class="primary">Explode Bot</button>
      <button id="reset-cam-btn">Reset View</button>
    </div>

    <div class="btn-row">
      <button id="export-glb-btn">Download .GLB Model</button>
    </div>

    <div class="control-header"><span>Inspect Component</span></div>
    <div class="parts-list" id="parts-container"></div>

    <div id="info-card">
      <strong id="info-title">Full Robothon 3.0 Assembly</strong>
      <span id="info-desc">Drag to rotate, scroll to zoom, or use the slider to explode the 7 core subsystems.</span>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f19);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3.8, 2.8, 4.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.2, 0);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(5, 8, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.8);
    rimLight.position.set(-5, 3, -4);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(10, 20, 0x334155, 0x1e293b);
    grid.position.y = -0.55;
    scene.add(grid);

    // Root Bot Group
    const botRoot = new THREE.Group();
    botRoot.name = "Robothon_3_Bot";
    scene.add(botRoot);

    // Subsystem metadata + explode vectors
    const subsystems = {
      chassis: {
        name: "Chassis",
        color: "#eab308",
        desc: "Bent sheet-metal U-channel base plate with side motor flanges and optional yellow aero deck.",
        group: new THREE.Group(),
        explodeOffset: new THREE.Vector3(0, -0.35, 0)
      },
      wheels: {
        name: "Wheels (x4)",
        color: "#f8fafc",
        desc: "6-hole deep-dish white rims with wide high-grip black chevron rubber tyres.",
        group: new THREE.Group(),
        explodeOffset: new THREE.Vector3(0, 0, 0) // handled per wheel
      },
      motors: {
        name: "DC Motors (x4)",
        color: "#94a3b8",
        desc: "12V 300 RPM cylindrical side-shaft geared DC motors with metal hex couplings.",
        group: new THREE.Group(),
        explodeOffset: new THREE.Vector3(0, -0.8, 0) // plus lateral per motor
      },
      l298n: {
        name: "L298N Driver",
        color: "#ef4444",
        desc: "Dual H-Bridge motor driver PCB with black anodized heatsink and blue screw terminals.",
        group: new THREE.Group(),
        explodeOffset: new THREE.Vector3(0, 0.95, 0.65)
      },
      battery: {
        name: "Battery Pack",
        color: "#cbd5e1",
        desc: "11.1V 3S Li-Ion/LiPo battery pack wrapped in protective silver duct tape with DC barrel lead.",
        group: new THREE.Group(),
        explodeOffset: new THREE.Vector3(0, 1.35, 0)
      },
      esp32: {
        name: "ESP32-WROOM",
        color: "#3b82f6",
        desc: "30-pin ESP32-WROOM-32 Wi-Fi/BLE microcontroller mounted on a mini breadboard.",
        group: new THREE.Group(),
        explodeOffset: new THREE.Vector3(0, 1.05, -0.75)
      },
      wires: {
        name: "Wires & Harness",
        color: "#22c55e",
        desc: "Silicone power leads (12V/GND), motor phase wires, and Dupont logic jumpers.",
        group: new THREE.Group(),
        explodeOffset: new THREE.Vector3(0, 1.85, 0)
      }
    };

    Object.entries(subsystems).forEach(([key, sub]) => {
      sub.group.name = sub.name.replace(/\s+/g, '_');
      botRoot.add(sub.group);
    });

    // Materials
    const matBlackMetal = new THREE.MeshStandardMaterial({ color: 0x1e242b, metalness: 0.6, roughness: 0.4 });
    const matYellowDeck = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.5, metalness: 0.1 });
    const matSilver = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.85, roughness: 0.25 });
    const matWhiteRim = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 });
    const matTire = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.85 });
    const matRedPCB = new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.35 });
    const matBlueTerm = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.4 });
    const matDarkPCB = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.3 });
    const matDuctTape = new THREE.MeshStandardMaterial({ color: 0x9ca3af, metalness: 0.45, roughness: 0.35 });

    // 1. CHASSIS (Bent metal U-channel + yellow top trim from Robothon photos)
    const basePlate = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.04, 2.2), matBlackMetal);
    subsystems.chassis.group.add(basePlate);

    // Side downward flanges for motor mounts
    [-0.68, 0.68].forEach(x => {
      const flange = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.32, 2.0), matBlackMetal);
      flange.position.set(x, -0.16, 0);
      subsystems.chassis.group.add(flange);
    });

    // Yellow top deck accent (like the yellow Robothon bots)
    const topDeck = new THREE.Mesh(new THREE.BoxGeometry(1.36, 0.02, 2.16), matYellowDeck);
    topDeck.position.y = 0.03;
    subsystems.chassis.group.add(topDeck);

    // 2 & 3. WHEELS & DC MOTORS (4WD)
    const wheelPositions = [
      { x: -0.95, z:  0.68, side: -1, name: "FL" },
      { x:  0.95, z:  0.68, side:  1, name: "FR" },
      { x: -0.95, z: -0.68, side: -1, name: "RL" },
      { x:  0.95, z: -0.68, side:  1, name: "RR" }
    ];

    const individualWheels = [];
    const individualMotors = [];

    wheelPositions.forEach(pos => {
      // Motor assembly
      const motorAssy = new THREE.Group();
      motorAssy.position.set(pos.side * 0.42, -0.18, pos.z);

      const can = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.42, 24), matSilver);
      can.rotation.z = Math.PI / 2;
      motorAssy.add(can);

      const gearbox = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.16, 24), matSilver);
      gearbox.rotation.z = Math.PI / 2;
      gearbox.position.x = pos.side * 0.22;
      motorAssy.add(gearbox);

      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.25, 16), matSilver);
      shaft.rotation.z = Math.PI / 2;
      shaft.position.x = pos.side * 0.38;
      motorAssy.add(shaft);

      // Hex coupler nut seen in image 4
      const hexNut = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.12, 6), matSilver);
      hexNut.rotation.z = Math.PI / 2;
      hexNut.position.x = pos.side * 0.36;
      motorAssy.add(hexNut);

      subsystems.motors.group.add(motorAssy);
      individualMotors.push({ mesh: motorAssy, basePos: motorAssy.position.clone(), side: pos.side });

      // Wheel assembly (White rim + Black treaded tyre)
      const wheelAssy = new THREE.Group();
      wheelAssy.position.set(pos.x, -0.18, pos.z);

      const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.28, 32), matTire);
      tire.rotation.z = Math.PI / 2;
      wheelAssy.add(tire);

      // Tread ribs
      for (let i = 0; i < 16; i++) {
        const angle = (i / 16) * Math.PI * 2;
        const tread = new THREE.Mesh(new THREE.BoxGeometry(0.29, 0.025, 0.04), matTire);
        tread.position.set(0, Math.cos(angle) * 0.36, Math.sin(angle) * 0.36);
        tread.rotation.x = angle;
        wheelAssy.add(tread);
      }

      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.29, 24), matWhiteRim);
      rim.rotation.z = Math.PI / 2;
      wheelAssy.add(rim);

      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.32, 16), matBlackMetal);
      hub.rotation.z = Math.PI / 2;
      wheelAssy.add(hub);

      subsystems.wheels.group.add(wheelAssy);
      individualWheels.push({ mesh: wheelAssy, basePos: wheelAssy.position.clone(), side: pos.side });
    });

    // 4. L298N MOTOR DRIVER (Front Deck)
    const l298nAssy = new THREE.Group();
    l298nAssy.position.set(0, 0.08, 0.68);

    const l298nPcb = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.03, 0.55), matRedPCB);
    l298nAssy.add(l298nPcb);

    // Black Heatsink
    const heatsink = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.22, 0.18), matDarkPCB);
    heatsink.position.set(0, 0.12, -0.02);
    l298nAssy.add(heatsink);

    // Blue Terminal Blocks (Left, Right, Front)
    const termLeft = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.22), matBlueTerm);
    termLeft.position.set(-0.21, 0.07, 0);
    l298nAssy.add(termLeft);

    const termRight = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.22), matBlueTerm);
    termRight.position.set(0.21, 0.07, 0);
    l298nAssy.add(termRight);

    const termFront = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.12, 0.1), matBlueTerm);
    termFront.position.set(-0.04, 0.07, 0.21);
    l298nAssy.add(termFront);

    subsystems.l298n.group.add(l298nAssy);

    // 5. BATTERY PACK (Silver Duct-Taped 3S Pack in Centre)
    const batteryAssy = new THREE.Group();
    batteryAssy.position.set(0, 0.15, -0.02);

    const batteryBody = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.22, 0.52), matDuctTape);
    batteryAssy.add(batteryBody);

    // Barrel Jack Connector on top
    const barrelJack = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.22, 16), matDarkPCB);
    barrelJack.rotation.z = Math.PI / 4;
    barrelJack.position.set(0.2, 0.16, 0.15);
    batteryAssy.add(barrelJack);

    subsystems.battery.group.add(batteryAssy);

    // 6. ESP32-WROOM + MINI BREADBOARD (Rear Deck)
    const espAssy = new THREE.Group();
    espAssy.position.set(0, 0.08, -0.72);

    const breadboard = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.06, 0.46), matWhiteRim);
    espAssy.add(breadboard);

    const espPcb = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.03, 0.30), matDarkPCB);
    espPcb.position.y = 0.06;
    espAssy.add(espPcb);

    const rfShield = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.04, 0.20), matSilver);
    rfShield.position.set(-0.12, 0.085, 0);
    espAssy.add(rfShield);

    const usbPort = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.035, 0.1), matSilver);
    usbPort.position.set(0.27, 0.075, 0);
    espAssy.add(usbPort);

    subsystems.esp32.group.add(espAssy);

    // Optional: Auto-load your local l298n.glb and esp32.glb if placed in the same directory
    const loader = new GLTFLoader();
    loader.load('./l298n.glb', (gltf) => {
      l298nAssy.clear();
      gltf.scene.scale.set(0.6, 0.6, 0.6);
      l298nAssy.add(gltf.scene);
    }, undefined, () => {});

    loader.load('./esp32.glb', (gltf) => {
      // Keep breadboard, replace procedural ESP32 with scanned GLB
      gltf.scene.scale.set(12, 12, 12);
      gltf.scene.position.set(1.58, -5.62, -10.98);
      espAssy.add(gltf.scene);
    }, undefined, () => {});

    // 7. WIRES & JUMPER HARNESS
    function addWire(points, hexColor, radius = 0.014) {
      const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
      const geo = new THREE.TubeGeometry(curve, 32, radius, 8, false);
      const mat = new THREE.MeshStandardMaterial({ color: hexColor, roughness: 0.4 });
      subsystems.wires.group.add(new THREE.Mesh(geo, mat));
    }

    // Jumper wires (ESP32 -> L298N)
    const jumperColors = [0xef4444, 0x3b82f6, 0xeab308, 0x22c55e, 0xa855f7, 0xf97316];
    jumperColors.forEach((col, idx) => {
      const offset = (idx - 2.5) * 0.05;
      addWire([
        [offset, 0.14, -0.62],
        [offset * 1.4, 0.48 + (idx % 2) * 0.05, -0.05],
        [offset * 0.6, 0.15, 0.48]
      ], col, 0.012);
    });

    // Battery Power Leads (Battery -> L298N)
    addWire([[0.15, 0.20, 0.15], [0.25, 0.32, 0.45], [-0.08, 0.14, 0.88]], 0xdc2626, 0.02);
    addWire([[0.05, 0.20, 0.15], [0.12, 0.30, 0.45], [0.02, 0.14, 0.88]], 0x111827, 0.02);

    // Motor Power Leads (L298N -> Left & Right Motors)
    addWire([[-0.22, 0.12, 0.68], [-0.52, 0.06, 0.68], [-0.52, -0.15, 0.68]], 0xdc2626, 0.015);
    addWire([[ 0.22, 0.12, 0.68], [ 0.52, 0.06, 0.68], [ 0.52, -0.15, 0.68]], 0xdc2626, 0.015);
    addWire([[-0.22, 0.12, 0.62], [-0.55, 0.06, -0.68], [-0.52, -0.15, -0.68]], 0x111827, 0.015);
    addWire([[ 0.22, 0.12, 0.62], [ 0.55, 0.06, -0.68], [ 0.52, -0.15, -0.68]], 0x111827, 0.015);

    // UI & Explode Logic
    let targetExplode = 0;
    let currentExplode = 0;
    const slider = document.getElementById('explode-slider');
    const explodeVal = document.getElementById('explode-val');
    const toggleBtn = document.getElementById('toggle-explode-btn');

    function setExplodeTarget(val) {
      targetExplode = val;
      slider.value = Math.round(val * 100);
      explodeVal.textContent = `${Math.round(val * 100)}%`;
      toggleBtn.textContent = val > 0.5 ? "Assemble Bot" : "Explode Bot";
    }

    slider.addEventListener('input', (e) => setExplodeTarget(e.target.value / 100));
    toggleBtn.addEventListener('click', () => setExplodeTarget(targetExplode > 0.5 ? 0 : 1));
    document.getElementById('reset-cam-btn').addEventListener('click', () => {
      camera.position.set(3.8, 2.8, 4.2);
      controls.target.set(0, 0.2, 0);
    });

    // Build Component Chips
    const partsContainer = document.getElementById('parts-container');
    const infoTitle = document.getElementById('info-title');
    const infoDesc = document.getElementById('info-desc');

    Object.entries(subsystems).forEach(([key, sub]) => {
      const chip = document.createElement('div');
      chip.className = 'part-chip';
      chip.innerHTML = `<span class="dot" style="background:${sub.color}"></span><span>${sub.name}</span>`;
      chip.addEventListener('click', () => {
        document.querySelectorAll('.part-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        infoTitle.textContent = sub.name;
        infoDesc.textContent = sub.desc;
        if (targetExplode < 0.4) setExplodeTarget(0.75);
      });
      partsContainer.appendChild(chip);
    });

    // Export .GLB Button
    document.getElementById('export-glb-btn').addEventListener('click', () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        botRoot,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'robothon_3_bot.glb';
          link.click();
        },
        (err) => console.error(err),
        { binary: true }
      );
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      currentExplode += (targetExplode - currentExplode) * 0.08;

      // Apply explode offsets
      Object.entries(subsystems).forEach(([key, sub]) => {
        if (key !== 'wheels' && key !== 'motors') {
          sub.group.position.copy(sub.explodeOffset).multiplyScalar(currentExplode);
        }
      });

      // Radial outward explode for wheels & motors
      individualWheels.forEach(w => {
        w.mesh.position.set(
          w.basePos.x + w.side * 0.95 * currentExplode,
          w.basePos.y,
          w.basePos.z
        );
        w.mesh.rotation.x += 0.015;
      });

      individualMotors.forEach(m => {
        m.mesh.position.set(
          m.basePos.x + m.side * 0.45 * currentExplode,
          m.basePos.y - 0.55 * currentExplode,
          m.basePos.z
        );
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
